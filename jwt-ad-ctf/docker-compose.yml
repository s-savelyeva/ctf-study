# JWT ARENA — A/D CTF. Три уязвимых сервиса, каждый своим контейнером
# (изоляция как в реальном A/D: патчи/перезапуск одного не трогают другие).
#
#   docker compose up -d --build          # запуск всех трёх
#   docker compose logs -f service-alg-none
#   docker compose down -v                # остановка
#
# Флаги можно задать в .env (см. .env.example) или прямо здесь.

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  # :8001 — Legacy Gateway: принимает токены с alg:none (без подписи)
  service-alg-none:
    <<: *service-base
    container_name: jwt-alg-none
    environment:
      ALG_NONE_FLAG: ${ALG_NONE_FLAG:-FLAG{alg_none_default_change_me}}
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 2
      --access-logfile - --error-logfile -
      'app.service_alg_none:app'
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # :8002 — Vault API: слабый секрет HS256 из словаря → брутфорс
  service-bruteforce:
    <<: *service-base
    container_name: jwt-bruteforce
    environment:
      BRUTEFORCE_FLAG: ${BRUTEFORCE_FLAG:-FLAG{bruteforce_default_change_me}}
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 2
      --access-logfile - --error-logfile -
      'app.service_bruteforce:app'
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # :8003 — Secure Portal: RS256, публичный ключ открыт → подмена RS256→HS256
  service-rs256:
    <<: *service-base
    container_name: jwt-rs256
    environment:
      RS256_FLAG: ${RS256_FLAG:-FLAG{rs256_hs256_default_change_me}}
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 2
      --access-logfile - --error-logfile -
      'app.service_rs256:app'
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
